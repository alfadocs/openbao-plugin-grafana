name: Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        grafana: ["12.2.1", "13.3.1"]
    services:
      grafana:
        image: grafana/grafana:${{ matrix.grafana }}
        ports: ["3000:3000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Make a Grafana admin token
        run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/health && break; sleep 2; done
          id=$(curl -sf -u admin:admin -H 'Content-Type: application/json' -d '{"name":"ci","role":"Admin"}' http://127.0.0.1:3000/api/serviceaccounts | jq .id)
          token=$(curl -sf -u admin:admin -H 'Content-Type: application/json' -d '{"name":"ci"}' "http://127.0.0.1:3000/api/serviceaccounts/$id/tokens" | jq -r .key)
          echo "::add-mask::$token"
          echo "GRAFANA_TEST_TOKEN=$token" >> "$GITHUB_ENV"
      - run: go vet ./... && go test -v ./...
        env:
          GRAFANA_TEST_URL: http://127.0.0.1:3000
